name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'index.js'
      - 'package.json'
      - 'index.html'
      - '.github/workflows/build-image.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/nds5:4
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HTTP Server
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Excalibase
        if: github.event_name != 'pull_request'
        env:
          EXCALIBASE_TOKEN: ${{ secrets.EXCALIBASE_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/nds5@${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          payload=$(jq -n --arg image "$IMAGE" --arg commit "$COMMIT_SHA" '{image: $image, commitSha: $commit}')
          curl --fail-with-body -sS -X POST 'https://app.excalibase.io/api/projects/proj-tyfvy2ntn6/apps/a2e5145f-04eb-451b-8b67-82470875c0fd/deploy?wait=true' \
            -H "Authorization: Bearer $EXCALIBASE_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload"
